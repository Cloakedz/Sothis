<!doctype html>
<html><head><meta charset="utf-8"><title>Voice</title>
<style>
html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #f1f2f6; user-select: none; }
#box { display: inline-flex; flex-direction: column; gap: 4px; padding: 6px; }
body.right #box { align-items: flex-end; }
.head { display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; background: rgba(10, 10, 14, .62); font-size: 11px; font-weight: 600; color: #b9bdc8; width: max-content; max-width: 240px; }
.head svg { width: 12px; height: 12px; color: #8b93ff; flex: none; }
.head span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p { display: flex; align-items: center; gap: 7px; width: max-content; max-width: 240px; padding: 2px 10px 2px 2px; border-radius: 999px; background: rgba(10, 10, 14, .55); transition: opacity .15s, background .15s; }
body.right .p { flex-direction: row-reverse; padding: 2px 2px 2px 10px; }
.p.quiet { opacity: .62; }
.p.talk { background: rgba(10, 10, 14, .78); opacity: 1; }
.av { position: relative; width: 28px; height: 28px; flex: none; }
.av img { width: 28px; height: 28px; border-radius: 50%; display: block; background: #2a2b33; box-shadow: 0 0 0 2px transparent; transition: box-shadow .1s; }
.p.talk .av img { box-shadow: 0 0 0 2px #3ccf8e, 0 0 10px rgba(60, 207, 142, .7); }
.st { position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; background: #16171c; color: #ff5a5a; display: grid; place-items: center; }
.st svg { width: 9px; height: 9px; }
.st.lm { color: #ffb02e; }
.n { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
.p.me .n { color: #ffd34d; }
body.compact .p:not(.talk) { display: none; }
body.compact .head { display: none; }
</style></head>
<body>
<div id="box"></div>
<script>
const mk = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const MIC_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M4 4l16 16"/></svg>';
const DEAF_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><path d="M4 4l16 16"/></svg>';
const SPK_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';
const VOICE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
vo.onState(s => {
  document.body.classList.toggle("right", /right/.test(s.corner || ""));
  document.body.classList.toggle("compact", !!s.onlyTalking);
  const box = document.getElementById("box"); box.replaceChildren();
  if (!s.channel) { vo.size(1, 1); return; }
  if (s.showHead !== false) { const h = mk("div", "head"); h.innerHTML = VOICE; h.append(mk("span", "", s.channel.name + (s.channel.guild ? " · " + s.channel.guild : ""))); box.append(h); }
  const list = s.channel.members.slice().sort((a, b) => (b.me - a.me) || a.name.localeCompare(b.name));
  if (/bottom/.test(s.corner || "")) box.style.justifyContent = "flex-end";
  list.forEach(m => {
    const p = mk("div", "p" + (m.speaking ? " talk" : " quiet") + (m.me ? " me" : ""));
    const av = mk("div", "av"), im = mk("img"); im.alt = ""; im.referrerPolicy = "no-referrer"; if (m.avatar) im.src = m.avatar; im.onerror = () => im.removeAttribute("src"); av.append(im);
    if (m.deaf || m.muted) { const b = mk("span", "st"); b.innerHTML = m.deaf ? DEAF_OFF : MIC_OFF; av.append(b); }
    else if (!m.me && m.localMute) { const b = mk("span", "st lm"); b.innerHTML = SPK_OFF; av.append(b); }
    p.append(av, mk("div", "n", m.name));
    box.append(p);
  });
  requestAnimationFrame(() => { const r = box.getBoundingClientRect(); vo.size(Math.ceil(r.width), Math.ceil(r.height)); });
});
</script>
</body></html>

# Publishes a GitHub release with the installer whenever package.json gets a new version.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Get the installer
        run: |
          git fetch --depth 1 origin installer
          git show origin/installer:Sothis-Setup.exe > Sothis-Setup.exe
          ls -la Sothis-Setup.exe
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" Sothis-Setup.exe --clobber
          else
            gh release create "v$V" Sothis-Setup.exe --title "Sothis $V" --notes-file .github/release-notes.md --target "$GITHUB_SHA" --latest
          fi

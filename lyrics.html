<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Lyrics · Sothis</title>
<style>
:root { --bg: #0b0b0f; --ink: #f1f2f6; --muted: #8b8f9c; --accent: #e8345b; --line: rgba(255, 255, 255, .1); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 500 15px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
body { display: flex; flex-direction: column; background: radial-gradient(120% 70% at 50% 0%, var(--tint, rgba(232, 52, 91, .22)), transparent 65%), var(--bg); transition: background 1s; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; -webkit-app-region: drag; border-bottom: 1px solid var(--line); }
.top img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: rgba(255, 255, 255, .06); flex: none; }
.top .t { flex: 1; min-width: 0; }
.top b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top button { -webkit-app-region: no-drag; width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.top button:hover { background: rgba(255, 255, 255, .08); color: var(--ink); }
.top button.on { color: var(--accent); }
.top svg { width: 16px; height: 16px; }
.ly { flex: 1; overflow-y: auto; padding: 40% 22px 50%; scroll-behavior: smooth; mask-image: linear-gradient(transparent, #000 18%, #000 70%, transparent); scrollbar-width: none; }
.ly::-webkit-scrollbar { display: none; }
.ly p { margin: 0 0 14px; font: 700 21px/1.3 "Segoe UI", system-ui, sans-serif; color: rgba(255, 255, 255, .32); transition: color .3s, transform .3s; transform-origin: left center; }
.ly p.on { color: #fff; transform: scale(1.04); text-shadow: 0 0 18px rgba(255, 255, 255, .25); }
.ly p.past { color: rgba(255, 255, 255, .5); }
.ly.plain p { color: rgba(255, 255, 255, .85); font-size: 17px; font-weight: 600; }
.msg { color: var(--muted); text-align: center; font-size: 14px; margin-top: 30%; }
</style>
</head>
<body>
<div class="top">
  <img id="art" alt="">
  <div class="t"><b id="t">Lyrics</b><span id="a">Play something in Sothis</span></div>
  <button id="pin" title="Keep on top" aria-label="Keep on top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M5 17h14l-2-5V4H7v8z"/></svg></button>
  <button id="back" title="Back into Sothis" aria-label="Back into Sothis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button>
  <button id="x" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div class="ly" id="ly"><p class="msg">Waiting for a song…</p></div>
<script>
const $ = id => document.getElementById(id);
let key = "", lines = [], cur = -2, st = null, at = 0;
$("x").onclick = () => ly.win("close");
$("back").onclick = () => ly.win("back");
$("pin").onclick = () => ly.win("top");
ly.top().then(v => $("pin").classList.toggle("on", !!v));
ly.onTop(v => $("pin").classList.toggle("on", !!v));
function build(d) {
  const box = $("ly"); box.className = "ly"; box.replaceChildren(); cur = -2;
  lines = (d.lyrics && d.lyrics.synced) || [];
  if (d.loading) { box.innerHTML = '<p class="msg">Finding lyrics…</p>'; return; }
  if (!d.lyrics) { box.innerHTML = '<p class="msg">No lyrics found for this song.</p>'; return; }
  if (d.lyrics.instrumental) { box.innerHTML = '<p class="msg">Instrumental ♪</p>'; return; }
  if (!lines.length) { box.className = "ly plain"; for (const l of String(d.lyrics.plain || "").split(/\n/)) { const p = document.createElement("p"); p.textContent = l || " "; box.append(p); } return; }
  for (const [, l] of lines) { const p = document.createElement("p"); p.textContent = l || "♪"; box.append(p); }
}
ly.onState(d => {
  st = d; at = performance.now();
  $("t").textContent = d.title || "Nothing playing"; $("a").textContent = d.artist || "";
  if (d.art) $("art").src = d.art; else $("art").removeAttribute("src");
  const k = (d.title || "") + "|" + (d.artist || "") + "|" + (d.loading ? 1 : 0) + "|" + (d.lyrics ? 1 : 0);
  if (k !== key) { key = k; build(d); }
});
function tick() {
  requestAnimationFrame(tick);
  if (!st || !lines.length) return;
  const pos = (st.pos || 0) + (st.playing ? (performance.now() - at) / 1000 : 0) + 0.25;
  let i = -1; for (let n = 0; n < lines.length; n++) { if (lines[n][0] <= pos) i = n; else break; }
  if (i === cur) return; cur = i;
  const ps = $("ly").children;
  for (let n = 0; n < ps.length; n++) { ps[n].classList.toggle("on", n === i); ps[n].classList.toggle("past", n < i); }
  if (i >= 0 && ps[i]) { const box = $("ly"); box.scrollTop = ps[i].offsetTop - box.clientHeight * 0.4; }
}
tick();
</script>
</body>
</html>

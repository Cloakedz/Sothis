.bar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 6px; padding: 5px; border-radius: 14px;
  background: rgba(10, 10, 14, .8); border: 1px solid rgba(255, 255, 255, .1); opacity: 0; transition: opacity .2s; -webkit-app-region: no-drag; max-width: calc(100% - 24px); }
body.show .bar, .bar:focus-within { opacity: 1; }
body:not(.show) { cursor: none; }
select { max-width: 190px; padding: 6px 8px; font: 500 12px/1.2 inherit; border-radius: 9px; background: rgba(0, 0, 0, .4); color: #eef0f5; border: 1px solid rgba(255, 255, 255, .14); }
button { width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent; color: #eef0f5; display: grid; place-items: center; cursor: pointer; }
button:hover { background: rgba(255, 255, 255, .08); }
button svg { width: 18px; height: 18px; }
button[aria-pressed="true"] { color: #ff4d5e; }
</style></head>
<body>
<div class="drag"></div>
<video id="vid" autoplay playsinline muted></video>
<canvas id="can" hidden></canvas>
<div class="msg" id="msg"><div><div class="logo"></div><div id="msgT">Starting your Switch…</div></div></div>
<div class="bar">
  <select id="src" aria-label="Video source"></select>
  <button id="snd" aria-label="Switch sound" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg></button>
  <button class="hd" id="hd" aria-label="Sharper upscaling" aria-pressed="true" title="Sharper upscaling">HD</button>
  <button id="top" aria-label="Keep on top" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4z"/></svg></button>
  <button id="full" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<script src="sw-upscale.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const mk = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
let stream = null, sound = store.get("sw.sound") === "1", starting = false, barT = null;
const msg = t => { $("msg").hidden = !t; $("msgT").textContent = t || ""; };
const isObsCam = d => /obs/i.test(d.label);
const isCard = d => /fifine|capture|cam link|elgato|hdmi|usb video|av\.?mmio|ezcap/i.test(d.label) && !isObsCam(d);
function stop() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $("vid").srcObject = null; }
async function devices() { try { return (await navigator.mediaDevices.enumerateDevices()) || []; } catch { return []; } }
async function start() {
  if (starting) return; starting = true; stop(); msg("Starting your Switch…");
  try {
    let devs = await devices();
    if (devs.some(d => d.kind === "videoinput" && !d.label)) { try { (await navigator.mediaDevices.getUserMedia({ video: true })).getTracks().forEach(t => t.stop()); } catch {} devs = await devices(); }
    const vids = devs.filter(d => d.kind === "videoinput");
    const sel = $("src"); sel.replaceChildren();
    const auto = mk("option", "", "Auto (capture card, then OBS)"); auto.value = ""; sel.append(auto);
    vids.forEach(d => { const o = mk("option", "", d.label || "Camera"); o.value = d.deviceId; sel.append(o); });
    const saved = store.get("sw.src") || ""; sel.value = vids.some(d => d.deviceId === saved) ? saved : "";
    const order = sel.value ? vids.filter(d => d.deviceId === sel.value) : [...vids.filter(isCard), ...vids.filter(isObsCam)];
    if (!order.length) { msg("No capture card or OBS Virtual Camera found."); return; }
    let s = null, used = null, busy = false;
    for (const d of order) {
      try { s = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: d.deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } } }); used = d; break; }
      catch (e) { if (e && (e.name === "NotReadableError" || e.name === "TrackStartError")) busy = true; }
    }
    if (!s) { msg(busy ? "OBS is using your capture card. In OBS, click Start Virtual Camera with the Switch scene showing." : "Couldn't open the video. Pick a different source."); return; }
    if (sound && !isObsCam(used)) {
      const mic = devs.find(d => d.kind === "audioinput" && d.groupId && d.groupId === used.groupId) || devs.find(d => d.kind === "audioinput" && isCard(d));
      if (mic) { try { (await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: mic.deviceId }, echoCancellation: false, noiseSuppression: false, autoGainControl: false, latency: 0 } })).getAudioTracks().forEach(t => s.addTrack(t)); } catch {} }
    }
    stream = s; const v = $("vid"); v.srcObject = s; v.muted = !sound || isObsCam(used); v.play().catch(() => {});
    msg("");
  } finally { starting = false; }
}
let hd = store.get("sw.hd") !== "0";
const up = window.SwUpscale ? SwUpscale.attach($("vid"), $("can")) : null;
const hdR = () => { $("hd").setAttribute("aria-pressed", hd && !!up); $("hd").hidden = !up; if (up) up.setOn(hd && !!stream); };
$("hd").onclick = () => { hd = !hd; store.set("sw.hd", hd ? "1" : "0"); hdR(); };
$("vid").addEventListener("playing", () => { hdR(); if (up) up.kick(); });
$("vid").addEventListener("emptied", () => up && up.setOn(false));
$("can").ondblclick = () => swPop.full();
hdR();
$("src").onchange = () => { store.set("sw.src", $("src").value); start(); };
const sndR = () => $("snd").setAttribute("aria-pressed", sound); sndR();
$("snd").onclick = () => { sound = !sound; store.set("sw.sound", sound ? "1" : "0"); sndR(); start(); };
$("full").onclick = () => swPop.full();
$("vid").ondblclick = () => swPop.full();
$("x").onclick = () => { stop(); swPop.close(); };
$("top").onclick = async () => $("top").setAttribute("aria-pressed", await swPop.top());
swPop.state().then(s => $("top").setAttribute("aria-pressed", !!(s && s.top))).catch(() => {});
document.addEventListener("mousemove", () => { document.body.classList.add("show"); clearTimeout(barT); barT = setTimeout(() => document.body.classList.remove("show"), 2000); });
document.addEventListener("keydown", e => { if (e.key === "f" || e.key === "F11") { e.preventDefault(); swPop.full(); } else if (e.key === "Escape") swPop.full(false); });
window.addEventListener("beforeunload", stop);
navigator.mediaDevices.addEventListener("devicechange", () => { if (!stream) start(); });
start();
</script>
</body></html>
